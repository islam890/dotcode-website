<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Syne:wght@400..800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Syne:wght@400..800&display=swap"
      />
    </noscript>

    <script>
      if (/^\/(en|fr|ar|de|es)\/?$/i.test(window.location.pathname)) {
        const preload = document.createElement("link");
        preload.rel = "preload";
        preload.as = "image";
        preload.type = "image/webp";
        preload.href = "/assets/hero-card-2.webp";
        preload.fetchPriority = "high";
        document.head.append(preload);
      }
    </script>

    <meta name="theme-color" content="#5b9bd5" />

    <title>DotCode Agency | Software & AI Solutions</title>

    <meta
      name="description"
      content="DotCode Agency builds digital products, AI solutions, and modern software experiences from idea to launch."
    />

    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="DotCode Agency | Software & AI Solutions"
    />
    <meta
      property="og:description"
      content="DotCode Agency builds digital products, AI solutions, and modern software experiences from idea to launch."
    />
    <meta property="og:site_name" content="DotCode Agency" />

    <meta name="twitter:card" content="summary" />

      name="twitter:title"
      content="DotCode Agency | Software & AI Solutions"
    />
    <meta
      name="twitter:description"
      content="DotCode Agency builds digital products, AI solutions, and modern software experiences from idea to launch."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.dotcodeagency.tech/#organization",
            "name": "DotCode",
            "url": "https://www.dotcodeagency.tech/",
            "description": "DotCode Agency builds digital products, AI solutions, and modern software experiences from idea to launch.",
            "sameAs": [
              "https://www.linkedin.com/company/dotcodeagency"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.dotcodeagency.tech/#website",
            "name": "DotCode",
            "url": "https://www.dotcodeagency.tech/",
            "publisher": {
              "@id": "https://www.dotcodeagency.tech/#organization"
            },
            "inLanguage": [
              "en",
              "fr",
              "ar",
              "de",
              "es"
            ]
          }
        ]
      }

  </head>
